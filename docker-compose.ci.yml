services:
  backend-test:
    build:
      context: ./backend
      target: dev
    command: ["pytest", "--cov=app", "--cov-report=term-missing", "--cov-fail-under=80"]
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ars_agenmatica
      - ENVIRONMENT=test
    depends_on:
      postgres:
        condition: service_healthy

  frontend-test:
    build:
      context: ./frontend
      target: dev
    command: ["npm", "run", "test"]

  e2e-test:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /app
    command: ["npx", "playwright", "test"]
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    environment:
      - CI=true
    depends_on:
      - frontend

volumes:
  e2e_node_modules:
